<VirtualHost 127.0.0.1:8080>
    ServerName kb.local

    WSGIDaemonProcess kb \
        user=www-data group=www-data \
        threads=8 processes=2 \
        home=/opt/kb \
        python-home=/opt/kb/venv \
        python-path=/opt/kb
    WSGIProcessGroup kb
    WSGIScriptAlias / /opt/kb/deploy/kb.wsgi

    Alias /static/ /opt/kb/static/
    <Directory /opt/kb/static>
        Require all granted
    </Directory>

    # Legacy media under static/videos must never be served directly.
    <Directory /opt/kb/static/videos>
        Require all denied
    </Directory>
    <LocationMatch "^/static/videos(?:/|$)">
        Require all denied
    </LocationMatch>

    <Directory /opt/kb/app>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    <Directory /opt/kb/deploy>
        <Files kb.wsgi>
            Require all granted
        </Files>
    </Directory>

    LimitRequestBody 1048576

    ErrorLog ${APACHE_LOG_DIR}/kb-error.log
    CustomLog ${APACHE_LOG_DIR}/kb-access.log combined
</VirtualHost>
