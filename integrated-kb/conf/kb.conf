<VirtualHost *:8080>
    ServerName kb.local

    WSGIDaemonProcess kb \
        user=www-data group=www-data \
        threads=8 processes=2 \
        home=/opt/kb \
        python-home=/opt/kb/venv \
        python-path=/opt/kb
    WSGIProcessGroup kb
    WSGIScriptAlias / /opt/kb/deploy/kb.wsgi

    Alias /static/ /opt/kb/static/
    <Directory /opt/kb/static>
        Require all granted
    </Directory>

    Alias /attachments/ /var/lib/kb/attachments/
    <Directory /var/lib/kb/attachments>
        Require all granted
    </Directory>

    <Directory /opt/kb/app>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    <Directory /opt/kb/deploy>
        <Files kb.wsgi>
            Require all granted
        </Files>
    </Directory>

    LimitRequestBody 5242880000

    ErrorLog ${APACHE_LOG_DIR}/kb-error.log
    CustomLog ${APACHE_LOG_DIR}/kb-access.log combined
</VirtualHost>
